<link rel="stylesheet" href="style.css" />




    <div class="app-container">

        <!-- HEADER -->
        <header class="app-header">

            <button
                class="btn-back"
                id="btnBack"
                aria-label="Go back"
            >
                <span class="back-arrow">&lsaquo;</span>
            </button>

            <h1 class="app-title">
                Emergency Alert
            </h1>

            <div class="spacer"></div>

        </header>

        <!-- MAIN -->
        <main>

            <!-- SETUP -->
            <section
                class="setup-area"
                id="setupArea"
            >

                <!-- LOCATION -->
                <section class="info-group">

                    <span class="label-tiny">
                        Current Location
                    </span>

                    <div
                        class="location-badge"
                        id="locationDisplay"
                    >
                        Locating...
                    </div>

                </section>

                <!-- HAZARDS -->
                <section class="info-group">

                    <span class="label-tiny">
                        Select Type of Hazard
                    </span>

                    <div class="hazard-grid">

                        <button
                            class="tile"
                            data-hazard="orks"
                            aria-pressed="false"
                        >
                            <span class="tile-title">
                                Orc Ambush
                            </span>

                            <span class="tile-desc">
                                Combat Support
                            </span>
                        </button>

                        <button
                            class="tile"
                            data-hazard="umwelt"
                            aria-pressed="false"
                        >
                            <span class="tile-title">
                                Trap / Hazard
                            </span>

                            <span class="tile-desc">
                                Physical Danger
                            </span>
                        </button>

                        <button
                            class="tile"
                            data-hazard="verlust"
                            aria-pressed="false"
                        >
                            <span class="tile-title">
                                Member Lost
                            </span>

                            <span class="tile-desc">
                                Search Party
                            </span>
                        </button>

                        <button
                            class="tile"
                            data-hazard="ring"
                            aria-pressed="false"
                        >
                            <span class="tile-title">
                                Nazgûl
                            </span>

                            <span class="tile-desc">
                                Stealth Mode
                            </span>
                        </button>

                    </div>

                </section>

            </section>

            <!-- SUMMARY -->
            <section
                class="summary-area hidden"
                id="summaryArea"
            >

                <section class="info-group">

                    <span class="label-tiny">
                        Transmission Status
                    </span>

                    <div class="summary-card">

                        <h3>
                            SIGNAL TRANSMITTED
                        </h3>

                        <p>
                            <strong>Location:</strong>
                            <span id="summaryLocation"></span>
                        </p>

                        <p>
                            <strong>Selected Threat:</strong>
                            <span id="summaryHazard"></span>
                        </p>

                        <p class="summary-timestamp">
                            Dispatched via Palantír Broadcast Network
                        </p>

                    </div>

                </section>

            </section>

            <!-- ACTION -->
            <section class="info-group">

                <button
                    class="btn-emergency"
                    id="btnEmergency"
                    disabled
                >
                    SEND ALERT NOW
                </button>

                <p
                    class="consequence-text"
                    id="statusMessage"
                >
                    Please select a hazard level above to unlock the transmission.
                </p>

            </section>

        </main>

        <!-- FOOTER -->
        <footer class="app-footer">

            <div class="status-pill">
                GPS Signal Locked
            </div>

        </footer>

    </div>

    <script src="app.js"></script>
