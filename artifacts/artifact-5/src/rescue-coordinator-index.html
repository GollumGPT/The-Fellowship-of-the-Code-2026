<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rescue Coordinator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rescue-coordinator-style.css">
  <script src="https://unpkg.com/chart.js@4.4.0/dist/chart.umd.js"></script>
</head>
<body>

<div class="coordinator-container">
  <div class="coordinator-header">
    <div class="coordinator-title">Rescue Coordinator</div>
    <div class="coordinator-subtitle">Command Center Dashboard with Chart.js</div>
  </div>

  <div class="kpi-section" id="kpiSection"></div>

  <div class="dashboard-section">
    <div class="chart-section">
      <div class="chart-label">Decision Status Overview</div>
      <canvas id="statusChart"></canvas>
    </div>

    <div class="incidents-section">
      <div class="chart-label">Active Incidents</div>
      <div class="incidents-list" id="incidentsGrid"></div>
    </div>
  </div>
</div>

<script src="rescue-coordinator-logic.js"></script>
</body>
</html>
